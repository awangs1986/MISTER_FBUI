<!DOCTYPE html>
<!--
  FBUI 皮肤布局预览。由 tools/skinpreview/gen.py 生成，数据全部内联，直接双击打开。

  画布尺寸恒等于帧缓冲尺寸，所有绘制都用整数帧缓冲像素，和 fbui.cpp 里的
  位图文字引擎一一对应。「CRT 观感」模式只是把画布按显示像素宽高比拉伸显示
  （240p 纵向两倍到 640x480），并不改变任何绘制坐标。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FBUI 皮肤预览</title>
<style>
  :root {
    --bg: #14171c; --panel: #1c2027; --line: #2c323c;
    --fg: #d6dbe3; --dim: #8b95a3; --accent: #4a90e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .sub { color: var(--dim); font-size: 12px; }
  main { display: flex; align-items: flex-start; gap: 20px; padding: 20px; flex-wrap: wrap; }
  .controls {
    width: 260px; flex: none; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px;
  }
  .controls h2 {
    font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--dim);
    margin: 18px 0 8px; text-transform: uppercase;
  }
  .controls h2:first-child { margin-top: 0; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button {
    flex: 1; padding: 6px 4px; background: transparent; color: var(--dim);
    border: 0; cursor: pointer; font: inherit; font-size: 12px;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }
  label.chk { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  label.chk input { accent-color: var(--accent); }
  .zoom { display: flex; align-items: center; gap: 8px; }
  .zoom input { flex: 1; accent-color: var(--accent); }
  .zoom span { width: 34px; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .stage { flex: 1; min-width: 0; }
  .frame {
    display: inline-block; padding: 12px; background: #000;
    border: 1px solid var(--line); border-radius: 4px;
  }
  canvas { display: block; image-rendering: pixelated; }
  .facts {
    margin-top: 16px; border-collapse: collapse; font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .facts td { padding: 3px 18px 3px 0; }
  .facts td:first-child { color: var(--dim); }
  .note {
    margin-top: 16px; max-width: 720px; color: var(--dim); font-size: 12px;
    border-left: 2px solid var(--line); padding-left: 12px;
  }
  .note b { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>FBUI 皮肤预览</h1>
  <span class="sub" id="hdr"></span>
</header>

<main>
  <div class="controls">
    <h2>分辨率档位</h2>
    <div class="seg" id="segProf"></div>

    <h2>显示方式</h2>
    <div class="seg" id="segView">
      <button data-v="crt">CRT 观感</button>
      <button data-v="raw">帧缓冲原始像素</button>
    </div>

    <h2>缩放</h2>
    <div class="zoom">
      <input type="range" id="zoom" min="0.25" max="4" step="0.25" value="1">
      <span id="zoomv"></span>
    </div>

    <h2>浏览层级</h2>
    <div class="seg" id="segLevel">
      <button data-v="sys">系统层</button>
      <button data-v="game">游戏层</button>
    </div>

    <h2>对照开关</h2>
    <label class="chk"><input type="checkbox" id="cjk2x" checked> CJK 横向倍宽（240p 修正）</label>
    <label class="chk"><input type="checkbox" id="safe"> 标出过扫描安全区</label>
    <label class="chk"><input type="checkbox" id="boxes"> 标出布局框</label>
    <label class="chk"><input type="checkbox" id="thumb" checked> 缩略图画圆形测试图</label>
  </div>

  <div class="stage">
    <div class="frame"><canvas id="cv"></canvas></div>
    <table class="facts" id="facts"></table>
    <div class="note" id="note"></div>
  </div>
</main>

<script>
const DATA = /*__DATA__*/null;

const ALIGN_LEFT = 0, ALIGN_CENTER = 1, ALIGN_RIGHT = 2;

const ui = {
  prof: null,
  view: "crt",
  zoom: 1,
  level: "sys",
  cjk2x: true,
  safe: false,
  boxes: false,
  thumb: true,
  sel: 3,
};

// ---------------------------------------------------------------------------
// 帧缓冲
// ---------------------------------------------------------------------------
// 一整块 Uint32 的离屏缓冲，画完一次性 putImageData。和引擎里的 shadow buffer
// 一样，绘制全程只跟整数像素打交道，不经过 canvas 的抗锯齿。

let FB = null, FBW = 0, FBH = 0;

function fbInit(w, h) {
  FBW = w; FBH = h;
  FB = new Uint32Array(w * h);
}

// canvas 的 ImageData 是小端 ABGR，输入按 0xRRGGBB 转一次。
function rgb(c) {
  return 0xFF000000 | ((c & 0xFF) << 16) | (c & 0xFF00) | ((c >> 16) & 0xFF);
}

function fillRect(x, y, w, h, color) {
  if (x < 0) { w += x; x = 0; }
  if (y < 0) { h += y; y = 0; }
  if (x + w > FBW) w = FBW - x;
  if (y + h > FBH) h = FBH - y;
  if (w <= 0 || h <= 0) return;
  const c = rgb(color);
  for (let j = 0; j < h; j++) FB.fill(c, (y + j) * FBW + x, (y + j) * FBW + x + w);
}

function strokeRect(x, y, w, h, color) {
  fillRect(x, y, w, 1, color);
  fillRect(x, y + h - 1, w, 1, color);
  fillRect(x, y, 1, h, color);
  fillRect(x + w - 1, y, 1, h, color);
}

// ---------------------------------------------------------------------------
// 位图文字引擎 —— 与 fbui.cpp 的 draw_glyph / draw_text / text_width 一一对应
// ---------------------------------------------------------------------------

let lowres = false;

function cjkXScale() { return lowres ? (ui.cjk2x ? 2 : 1) : 1; }

function glyphRow(x, y, bits, nbits, sx, sy, color) {
  for (let i = 0; i < nbits; i++)
    if (bits & (1 << (nbits - 1 - i))) fillRect(x + i * sx, y, sx, sy, color);
}

// charfont 是列优先、bit0 在上，取出一行的 8 个点
function charfontRow(g, row) {
  let bits = 0;
  for (let col = 0; col < 8; col++) if (g[col] & (1 << row)) bits |= 0x80 >> col;
  return bits;
}

function uniGlyph(cp) { return DATA.glyphs[String(cp)] || null; }

function glyphAdv(cp, s) {
  if (lowres && cp < 0x80) return 16;
  const rec = uniGlyph(cp);
  const wide = rec ? rec.w === 16 : cp >= 0x80;
  return wide ? 16 * cjkXScale() * s : 8 * s;
}

function drawGlyph(x, y, cp, color, s) {
  const xs = cjkXScale();

  // 240p 的 ASCII 用 MiSTer 内建 8x8 字面精确放大两倍，和 unifont 的 CJK
  // 共用同一个 16x16 格子
  if (lowres && cp < 0x80) {
    const g = DATA.charfont[cp & 0x7F];
    for (let row = 0; row < 8; row++)
      glyphRow(x, y + row * 2, charfontRow(g, row), 8, 2, 2, color);
    return 16;
  }

  const rec = uniGlyph(cp);
  if (rec) {
    const wide = rec.w === 16;
    const nbits = wide ? 16 : 8;
    const sx = (wide ? xs : 1) * s;
    for (let row = 0; row < 16; row++)
      glyphRow(x, y + row * s, rec.rows[row], nbits, sx, s, color);
    return nbits * sx;
  }

  if (cp < 0x80) {
    const g = DATA.charfont[cp & 0x7F];
    for (let row = 0; row < 8; row++)
      glyphRow(x, y + (row * 2 + 1) * s, charfontRow(g, row), 8, s, 2 * s, color);
    return 8 * s;
  }

  // 缺字：空心方框
  const sx = xs * s, w = 14 * sx;
  fillRect(x + sx, y + 2 * s, w, s, color);
  fillRect(x + sx, y + 13 * s, w, s, color);
  fillRect(x + sx, y + 2 * s, sx, 12 * s, color);
  fillRect(x + w, y + 2 * s, sx, 12 * s, color);
  return 16 * sx;
}

function textWidth(str, s) {
  let w = 0;
  for (const ch of str) w += glyphAdv(ch.codePointAt(0), s);
  return w;
}

function drawText(x, y, str, color, s, maxW) {
  let cx = 0;
  for (const ch of str) {
    const cp = ch.codePointAt(0);
    const adv = glyphAdv(cp, s);
    if (maxW && cx + adv > maxW) {
      if (maxW >= cx + 6 * s)
        for (let i = 0; i < 3; i++)
          fillRect(x + cx + i * 2 * s + s, y + (lowres ? 14 : 14 * s), s, s, color);
      break;
    }
    drawGlyph(x + cx, y, cp, color, s);
    cx += adv;
  }
  return cx;
}

// 位图字面只存在于 16px 的整数倍上，请求的字号取最接近的那一档
function bitmapScale(px) {
  if (lowres) return 1;
  return Math.max(1, Math.floor((px + 8) / 16));
}

function uiText(x, y, str, color, px, maxW, align) {
  const s = bitmapScale(px);
  if (maxW > 0 && align !== ALIGN_LEFT) {
    const tw = textWidth(str, s);
    if (tw < maxW) x += align === ALIGN_CENTER ? ((maxW - tw) / 2 | 0) : (maxW - tw);
  }
  return drawText(x, y, str, color, s, maxW);
}

function uiTextWidth(str, px) {
  return textWidth(str, bitmapScale(px));
}

// ---------------------------------------------------------------------------
// 场景
// ---------------------------------------------------------------------------

function L() { return DATA.profiles[ui.prof]; }

// layout.ini 的 list=/panel=/safe= 是逗号分量，这里按名字取
function geo(l) {
  const [sl, st_, sr, sb] = l.safe;
  const [lx, ly, lw, lh] = l.list;
  const [px, py, pw, ph] = l.panel;
  const rows = Math.max(1, Math.floor(lh / l.row_h));
  return {
    sl, st: st_, sr, sb, lx, ly, lw, lh, rows,
    px, py, pw, ph,
    w: l.w !== undefined ? l.w : (ui.prof === "240p" ? 640 : 1920),
    h: l.h !== undefined ? l.h : (ui.prof === "240p" ? 240 : 1080),
  };
}

// 没有 bg.png 时程序内合成的静态层，规则和 fbui.cpp 的 render_bglayer 一致
function drawProceduralBg(l, g) {
  const top = l.col_bg_top, bot = l.col_bg_bot;
  for (let y = 0; y < FBH; y++) {
    const r = ((top >> 16 & 255) + ((bot >> 16 & 255) - (top >> 16 & 255)) * y / FBH) | 0;
    const gg = ((top >> 8 & 255) + ((bot >> 8 & 255) - (top >> 8 & 255)) * y / FBH) | 0;
    const b = ((top & 255) + ((bot & 255) - (top & 255)) * y / FBH) | 0;
    fillRect(0, y, FBW, 1, (r << 16) | (gg << 8) | b);
  }
  const bx = g.sl, bw = FBW - g.sl - g.sr;
  const accent = 2 * (l.h >= 900 ? 2 : 1);
  fillRect(bx, g.st, bw, l.header_h, l.col_header);
  fillRect(bx, g.st + l.header_h - accent, bw, accent, l.col_accent);
  fillRect(bx, FBH - g.sb - l.footer_h, bw, l.footer_h, l.col_header);
  fillRect(g.px, g.py, g.pw, g.ph, l.col_panel);
  fillRect(g.px, g.py, g.pw, accent, l.col_accent);
}

// 缩略图占位：一个圆。烘焙时已经按显示像素宽高比做过预变形，所以帧缓冲里它
// 必须是个椭圆 —— 在 CRT 观感下看着圆才说明整条链路的比例是对的。
function drawThumbTest(l, g) {
  const parY = (l.par && l.par[1]) || 1, parX = (l.par && l.par[0]) || 1;
  fillRect(g.px, g.py, g.pw, g.ph, 0x101418);

  const cx = g.px + g.pw / 2, cy = g.py + g.ph / 2;
  // 视觉上要圆：半径在屏幕单位上相等，换算回帧缓冲就是横小纵大
  const rv = Math.min(g.pw * parX, g.ph * parY) * 0.36;
  const rx = rv / parX, ry = rv / parY;
  for (let y = 0; y < g.ph; y++) {
    const dy = (g.py + y - cy) / ry;
    if (Math.abs(dy) > 1) continue;
    const half = rx * Math.sqrt(1 - dy * dy);
    fillRect(Math.round(cx - half), g.py + y, Math.round(half * 2), 1, 0x3a6ea5);
  }
  strokeRect(g.px, g.py, g.pw, g.ph, 0x2a3542);

  const cap = "封面 COVER";
  const s = lowres ? 1 : 2;
  const tw = textWidth(cap, s);
  drawText(g.px + ((g.pw - tw) / 2 | 0), g.py + g.ph - (lowres ? 20 : 40), cap, 0xE8EEF6, s, g.pw);
}

function render() {
  const l = L(), g = geo(l);
  lowres = ui.prof === "240p";
  fbInit(g.w, g.h);

  const rows = ui.level === "sys" ? DATA.rows_sys : DATA.rows_game;
  const total = rows.length;
  if (ui.sel >= total) ui.sel = total - 1;
  const visible = g.rows;
  let top = 0;
  if (ui.sel >= visible) top = Math.min(ui.sel - visible + 1, Math.max(0, total - visible));

  // ---- 静态层
  if (bgImage) {
    const id = bgCtx.getImageData(0, 0, g.w, g.h);
    FB.set(new Uint32Array(id.data.buffer));
  } else {
    drawProceduralBg(l, g);
  }

  // ---- 顶栏
  const pad = l.row_pad;
  const tpx = l.title_px;
  let ty = g.st + ((l.header_h - tpx) / 2 | 0);
  if (ty < g.st) ty = g.st;
  const title = ui.level === "sys" ? DATA.sample.title_sys : DATA.sample.title_game;
  const cnt = (ui.sel + 1) + " / " + total;
  const cw = uiTextWidth(cnt, l.font_px);
  const hw = FBW - g.sl - g.sr;
  const tw = hw - cw - 3 * pad;
  if (tw > 0) uiText(g.sl + pad, ty, title, l.col_title, tpx, tw, ALIGN_LEFT);
  uiText(g.sl + hw - cw - pad, g.st + ((l.header_h - l.font_px) / 2 | 0), cnt,
         l.col_dim, l.font_px, cw, ALIGN_RIGHT);

  // ---- 列表
  for (let r = 0; r < visible; r++) {
    const idx = top + r;
    const y = g.ly + r * l.row_h;
    if (idx === ui.sel) fillRect(g.lx, y, g.lw, l.row_h, l.col_sel_bar);
    if (idx >= total) continue;
    const isDir = ui.level === "sys";
    const fg = idx === ui.sel ? l.col_sel_text : (isDir ? l.col_accent : l.col_text);
    const px = l.font_px;
    const ry = y + ((l.row_h - px) / 2 | 0);
    uiText(g.lx + pad, ry, rows[idx], fg, px, g.lw - 2 * pad,
           l.list_align === "center" ? ALIGN_CENTER : ALIGN_LEFT);
  }

  // 滚动条
  const scale = l.h >= 900 ? 2 : 1;
  const sbx = g.lx + g.lw + 4 * scale;
  const sbh = visible * l.row_h;
  if (sbx + 3 * scale <= FBW && total > visible) {
    let th = (sbh * visible / total) | 0;
    if (th < 8 * scale) th = 8 * scale;
    const to = ((sbh - th) * top / (total - visible)) | 0;
    fillRect(sbx, g.ly + to, 3 * scale, th, l.col_sel_bar);
  }

  // ---- 媒体面板
  if (ui.thumb) drawThumbTest(l, g);
  else uiText(g.px, g.py + (g.ph / 2 | 0) - l.font_px, rows[ui.sel], l.col_dim,
              l.font_px * 2, g.pw, ALIGN_CENTER);

  // ---- 底栏
  const fpx = l.footer_px;
  const fy = FBH - g.sb - l.footer_h;
  let fty = fy + ((l.footer_h - fpx) / 2 | 0);
  if (fty < fy) fty = fy;
  const hint = lowres
    ? (ui.level === "sys" ? DATA.sample.hint_sys : DATA.sample.hint_game)
    : (ui.level === "sys" ? DATA.sample.hint_sys_hd : DATA.sample.hint_game_hd);
  uiText(g.sl + pad, fty, hint, l.col_dim, fpx, hw - 2 * pad, ALIGN_LEFT);

  // ---- 辅助标尺（画在最上层，不属于皮肤）
  if (ui.safe) {
    strokeRect(g.sl, g.st, FBW - g.sl - g.sr, FBH - g.st - g.sb, 0xFF4040);
  }
  if (ui.boxes) {
    strokeRect(g.lx, g.ly, g.lw, g.lh, 0x40FF80);
    strokeRect(g.px, g.py, g.pw, g.ph, 0xFFC040);
  }

  blit(l, g);
  facts(l, g, visible, total);
}

let bgImage = null, bgCtx = null;

function blit(l, g) {
  const cv = document.getElementById("cv");
  cv.width = g.w; cv.height = g.h;
  const ctx = cv.getContext("2d");
  const id = ctx.createImageData(g.w, g.h);
  new Uint32Array(id.data.buffer).set(FB);
  ctx.putImageData(id, 0, 0);

  // PAR 只影响显示尺寸，不影响任何绘制坐标
  const parX = (l.par && l.par[0]) || 1, parY = (l.par && l.par[1]) || 1;
  const sx = ui.view === "crt" ? parX : 1;
  const sy = ui.view === "crt" ? parY : 1;
  cv.style.width = (g.w * sx * ui.zoom) + "px";
  cv.style.height = (g.h * sy * ui.zoom) + "px";
}

function facts(l, g, visible, total) {
  const parX = (l.par && l.par[0]) || 1, parY = (l.par && l.par[1]) || 1;
  const slotKiB = g.pw * g.ph * 4 / 1024;
  const slots = Math.floor(l.cache_mb * 1024 / slotKiB);
  const rowsEl = [
    ["帧缓冲", g.w + " x " + g.h],
    ["显示像素宽高比", parX + " : " + parY + (parY > parX ? "（像素比宽的高）" : "（方像素）")],
    ["CRT 上的呈现", (g.w * parX) + " x " + (g.h * parY) + "，即 " +
      (Math.round(g.w * parX / (g.h * parY) * 100) / 100) + " : 1"],
    ["列表可见行数", visible + " 行（共 " + total + " 条）"],
    ["行高 / 字号", l.row_h + " / " + l.font_px + " px"],
    ["CJK 实际绘制", lowres
      ? (ui.cjk2x ? "32 宽 x 16 高 → 屏上 32 x 32，方的"
                  : "16 宽 x 16 高 → 屏上 16 x 32，被压成半宽")
      : (16 * bitmapScale(l.font_px)) + " 宽 x " + (16 * bitmapScale(l.font_px)) + " 高"],
    ["点阵档位吸附", lowres ? "240p 恒为 16px 一档"
      : "正文 " + l.font_px + "→" + 16 * bitmapScale(l.font_px) +
        "，标题 " + l.title_px + "→" + 16 * bitmapScale(l.title_px) +
        "，底栏 " + l.footer_px + "→" + 16 * bitmapScale(l.footer_px) + " px"],
    ["面板 / 缩略图槽", g.pw + " x " + g.ph + "，单张 " + Math.round(slotKiB) + " KiB"],
    ["缓存预算", l.cache_mb + " MiB → 约 " + slots + " 张"],
    ["安全区内缩", g.sl + " / " + g.st + " / " + g.sr + " / " + g.sb + " px"],
  ];
  document.getElementById("facts").innerHTML =
    rowsEl.map(r => "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>").join("");

  document.getElementById("note").innerHTML = lowres
    ? "<b>240p 要看的三件事。</b>一、把「CJK 横向倍宽」关掉再打开，" +
      "汉字从被压成半宽变回方的，这就是之前中文看不清的原因。" +
      "二、勾上「过扫描安全区」，红框以外的内容在真 CRT 上会被切掉，" +
      "确认没有文字压到框上。三、缩略图里的圆在这个视图下应该是正圆，" +
      "如果是椭圆说明烘焙时的预变形算错了。"
    : "<b>1080p 是方像素</b>，两个视图看起来一样。默认皮肤没有指定 TrueType 字体，" +
      "所以这里走的也是点阵引擎 —— 它只有 16px 和 32px 两档，字号取最接近的那档；" +
      "在 skin.ini 里配上 font= 之后真机会改用 stb_truetype，字面会比这里平滑。";
}

// ---------------------------------------------------------------------------
// 交互
// ---------------------------------------------------------------------------

function seg(id, key, onChange) {
  const el = document.getElementById(id);
  el.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    ui[key] = b.dataset.v;
    [...el.children].forEach(c => c.classList.toggle("on", c === b));
    (onChange || render)();
  });
  const cur = [...el.children].find(c => c.dataset.v === ui[key]) || el.children[0];
  ui[key] = cur.dataset.v;
  cur.classList.add("on");
}

function loadBg(then) {
  const l = L();
  if (!l.bg_data) { bgImage = null; then(); return; }
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    bgCtx = c.getContext("2d");
    bgCtx.drawImage(img, 0, 0);
    bgImage = img;
    then();
  };
  img.onerror = () => { bgImage = null; then(); };
  img.src = l.bg_data;
}

function init() {
  const profEl = document.getElementById("segProf");
  profEl.innerHTML = Object.keys(DATA.profiles)
    .map(p => '<button data-v="' + p + '">' + p + "</button>").join("");
  ui.prof = Object.keys(DATA.profiles)[0];

  seg("segProf", "prof", () => loadBg(render));
  seg("segView", "view");
  seg("segLevel", "level", () => { ui.sel = 3; render(); });

  for (const id of ["cjk2x", "safe", "boxes", "thumb"]) {
    const el = document.getElementById(id);
    el.checked = ui[id];
    el.addEventListener("change", () => { ui[id] = el.checked; render(); });
  }

  const z = document.getElementById("zoom");
  const zv = document.getElementById("zoomv");
  const setZoom = () => {
    ui.zoom = parseFloat(z.value);
    zv.textContent = ui.zoom + "x";
    render();
  };
  z.addEventListener("input", setZoom);

  document.addEventListener("keydown", e => {
    const rows = ui.level === "sys" ? DATA.rows_sys : DATA.rows_game;
    if (e.key === "ArrowDown") ui.sel = Math.min(ui.sel + 1, rows.length - 1);
    else if (e.key === "ArrowUp") ui.sel = Math.max(ui.sel - 1, 0);
    else return;
    e.preventDefault();
    render();
  });

  document.getElementById("hdr").textContent =
    "皮肤包 " + DATA.skin + " · 上下键移动选中项";

  ui.zoom = parseFloat(z.value);
  zv.textContent = ui.zoom + "x";
  loadBg(render);
}

init();
</script>
</body>
</html>
